[project]
name = "stupidbench"
version = "0.1.0"
description = "A weekly long-horizon optimization bench that runs on GitHub Actions."
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
]

[project.scripts]
stupidbench = "stupidbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["uv-build>=0.9.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stupidbench"
module-root = "src"
source-include = ["src/stupidbench/task/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# ./docker holds a build context, not an import root: without this, isort reads
# it as the first-party spelling of the third-party `docker` package.
src = ["src"]
# The task is a payload, copied into cells verbatim and scored on. A lint fix
# there is a change to what the bench measures, so nothing here touches it.
extend-exclude = ["src/stupidbench/task"]
