name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5

      - run: uvx ruff format --check .
      - run: uvx ruff check .

      # The isolation tests need the image a cell runs in, which is public and
      # sixteen gigabytes; without it they skip themselves.
      - name: Free disk space for the runtime image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          df -h

      - run: docker pull ghcr.io/humanfia/flowbench-runtime:latest

      - run: uv run pytest -q
