name: stupid bench

# One run is the whole bench: fifteen cells, twenty-four hours of agent time
# each, and nothing left behind for the run after it.
#
# A hosted job is capped at six hours, so no job can hold a cell that is
# budgeted at twenty-four. Eight segments run in turn instead, and each hands
# every cell it carried to the next as an artifact of this run. Only the time a
# cell actually ran counts against its budget, so a segment costs it the four
# and a half hours it gives it and nothing else, and a segment that finds the
# budget spent has nothing to do and says so.
#
# Six segments would cover the twenty-four hours and no more. A job that dies
# takes a whole segment with it — twice in ninety, the first time this ran:
# once the runner could not fetch an action, once it stopped answering
# mid-segment — and there is no retrying a job in Actions. What retries it is
# the segment after it, which takes the cell back from the last artifact and
# carries it on, so what a lost segment costs is capacity rather than work.
# Eight give a cell thirty-six hours of it, which is two whole segments more
# than its budget can spend.
#
# Nothing here is cached and no artifact of another run is ever read, so every
# run stages its cells from nothing: what a run leaves behind is a result, not a
# state the next one continues.
#
# What Actions drops rather than fails — the jobs it cancels when it is having
# an outage of its own — is recovered by re-running the failed jobs of the run.
# An artifact belongs to the run and not to the attempt, so the second attempt
# takes each cell back exactly where the first left it, and re-publishing over
# what the first attempt left is allowed. A new run has a new id and no
# artifacts of its own, so none of that reaches it.

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# One bench at a time. Two runs share no cell now, but they would spend the same
# credentials against the same rate limits, and neither would be the run it was
# meant to be.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# This repository is public, and only these two events can carry a secret: no
# pull request runs this, so nothing a stranger can open ever sees a token.
permissions:
  contents: read

jobs:
  # A segment fails for one cell at a time — an agent that cannot work spends
  # its segment and says nothing — and the relay is what the rest of the budget
  # is still in. So every leg waits for the one before it and runs regardless of
  # what became of it; only a cancelled run stops the relay.
  segment-1:
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-2:
    needs: segment-1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-3:
    needs: segment-2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-4:
    needs: segment-3
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 4
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-5:
    needs: segment-4
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-6:
    needs: segment-5
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 6
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-7:
    needs: segment-6
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 7
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  segment-8:
    needs: segment-7
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/segment.yaml
    with:
      segment: 8
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # A segment knows one cell; the report reads them together, so that the seeds
  # of a flow can be averaged into one curve. It is the last thing the run does,
  # and every cell it reads is one this run finished.
  report:
    needs: segment-8
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: cell-*
          merge-multiple: true
          path: archives

      - name: Unpack every cell the run carried
        run: |
          shopt -s nullglob
          for archive in archives/*.tgz; do
            tar -xzf "$archive"
          done
          rm -rf archives

      - name: Draw the curves
        run: uv run stupidbench report --out report > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: report
          retention-days: 90

      - name: Write the summary
        run: cat report/report.md >> "$GITHUB_STEP_SUMMARY"
